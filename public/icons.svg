<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pwaBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Cyan to Royal Blue Gradient -->
    <linearGradient id="pwaCyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Silver White Gradient -->
    <linearGradient id="pwaSilverWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="pwaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#2563eb" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Modern Dark Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#pwaBgGrad)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="12" />

  <!-- Translucent Precision Grid Box -->
  <rect x="144" y="144" width="224" height="224" rx="40" fill="rgba(37, 99, 235, 0.15)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="8" stroke-dasharray="16 16" />

  <!-- Top-Left Crop Mark (Vibrant Cyan-Blue) -->
  <path d="M112 48 V288 A48 48 0 0 0 160 336 H400" fill="none" stroke="url(#pwaCyanBlueGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" filter="url(#pwaGlow)" />

  <!-- Bottom-Right Crop Mark (Clean White) -->
  <path d="M400 464 V224 A48 48 0 0 0 352 176 H112" fill="none" stroke="url(#pwaSilverWhiteGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Precision Center Aperture Point -->
  <circle cx="256" cy="256" r="26" fill="#38bdf8" />
  <circle cx="256" cy="256" r="11" fill="#ffffff" />
</svg>
