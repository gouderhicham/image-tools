<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Cyan to Royal Blue Gradient -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Silver White Gradient -->
    <linearGradient id="silverWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#2563eb" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Modern Dark Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.5" />

  <!-- Translucent Precision Grid Box -->
  <rect x="18" y="18" width="28" height="28" rx="5" fill="rgba(37, 99, 235, 0.15)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Top-Left Crop Mark (Vibrant Cyan-Blue) -->
  <path d="M14 6 V36 A6 6 0 0 0 20 42 H50" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#iconGlow)" />

  <!-- Bottom-Right Crop Mark (Clean White) -->
  <path d="M50 58 V28 A6 6 0 0 0 44 22 H14" fill="none" stroke="url(#silverWhiteGrad)" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Precision Center Aperture Point -->
  <circle cx="32" cy="32" r="3.2" fill="#38bdf8" />
  <circle cx="32" cy="32" r="1.4" fill="#ffffff" />
</svg>